<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Academie – speel jezelf AI-expert</title>
<style>
:root {
  --bg: #f3f5fa; --kaart: #ffffff; --tekst: #1d2433; --zacht: #5d6578;
  --blauw: #2f5bea; --blauw-d: #1f3fb0; --paars: #7b4ce0;
  --goed: #1f9d55; --goed-l: #dcf5e6; --fout: #d23c3c; --fout-l: #fde4e4;
  --geel: #fff4cc; --rand: #dfe4ef; --schaduw: 0 2px 4px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.08);
  --basis: 19px;
}
body.groot { --basis: 22px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--tekst); font: var(--basis)/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Verdana, sans-serif; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { line-height: 1.25; margin: .3em 0; }
h1 { font-size: 1.55em; } h2 { font-size: 1.25em; } h3 { font-size: 1.05em; }
p { margin: .45em 0; }
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: .6em; padding: .5em .9em;
  background: linear-gradient(90deg, #1f3fb0, #7b4ce0); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.top .titel { flex: 1; font-weight: 700; }
.top button { border: none; background: rgba(255,255,255,.18); color: #fff; border-radius: 12px; padding: .25em .6em; font-size: 1em; }
.xp-pil { background: rgba(255,255,255,.18); border-radius: 999px; padding: .15em .7em; font-weight: 700; white-space: nowrap; }
main { max-width: 920px; margin: 0 auto; padding: 1em 1em 5em; }
.kaart { background: var(--kaart); border-radius: 18px; padding: 1.1em 1.2em; box-shadow: var(--schaduw); margin-bottom: 1em; }
.held { background: linear-gradient(135deg, #2f5bea, #7b4ce0); color: #fff; }
.held .zacht { color: #e3e8ff; }
.zacht { color: var(--zacht); }
.klein { font-size: .85em; }
.balk { height: 14px; background: rgba(0,0,0,.08); border-radius: 999px; overflow: hidden; }
.held .balk { background: rgba(255,255,255,.25); }
.balk > div { height: 100%; background: linear-gradient(90deg, #36c27a, #1f9d55); border-radius: 999px; transition: width .4s; }
.held .balk > div { background: #ffd34d; }
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .9em; }
.tegel { text-align: left; border: 2px solid transparent; background: var(--kaart); border-radius: 18px; padding: 1em; box-shadow: var(--schaduw); transition: transform .12s, border-color .12s; }
.tegel:hover { transform: translateY(-2px); border-color: var(--blauw); }
.tegel .ico { font-size: 2em; }
.tegel b { display: block; font-size: 1.05em; margin: .2em 0; }
.tegel span { color: var(--zacht); font-size: .85em; }
.knop { border: none; background: var(--blauw); color: #fff; border-radius: 14px; padding: .6em 1.2em; font-weight: 600; box-shadow: 0 3px 0 var(--blauw-d); }
.knop:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blauw-d); }
.knop.wit { background: #fff; color: var(--blauw); box-shadow: 0 3px 0 #c9d3f0; border: 2px solid #c9d3f0; }
.knop:disabled { opacity: .45; cursor: default; }
.knoppen { display: flex; gap: .6em; flex-wrap: wrap; margin-top: .8em; }
.opties { display: grid; gap: .6em; margin-top: .8em; }
.optie { text-align: left; border: 2px solid var(--rand); background: #fff; border-radius: 14px; padding: .7em 1em; transition: border-color .1s, background .1s; }
.optie:hover:not(:disabled) { border-color: var(--blauw); background: #f5f7ff; }
.optie:disabled { cursor: default; }
.optie.goed { border-color: var(--goed); background: var(--goed-l); }
.optie.fout { border-color: var(--fout); background: var(--fout-l); }
.optie.gekozen { border-color: var(--blauw); background: #e8edff; }
.uitleg { margin-top: .9em; padding: .8em 1em; border-radius: 14px; background: var(--geel); border-left: 6px solid #f0b400; }
.uitleg.goed { background: var(--goed-l); border-left-color: var(--goed); }
.uitleg.fout { background: var(--fout-l); border-left-color: var(--fout); }
.voortgang { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-bottom: .5em; color: var(--zacht); font-size: .9em; }
.label { display: inline-block; font-size: .75em; font-weight: 700; padding: .1em .6em; border-radius: 999px; background: #e8edff; color: var(--blauw-d); }
.twee { display: grid; grid-template-columns: 1fr 1fr; gap: .6em; }
@media (max-width: 600px) { :root { --basis: 17px; } body.groot { --basis: 20px; } .twee { grid-template-columns: 1fr; } main { padding: .7em .6em 5em; } }
.thema-rij { display: flex; align-items: center; gap: .8em; padding: .6em 0; border-bottom: 1px solid var(--rand); }
.thema-rij:last-child { border-bottom: none; }
.thema-rij .naam { flex: 1; }
.thema-rij .balk { width: 120px; }
.toast { position: fixed; left: 50%; bottom: 1.2em; transform: translateX(-50%); background: #1d2433; color: #fff; padding: .6em 1.2em; border-radius: 999px; z-index: 40; box-shadow: var(--schaduw); animation: op .3s; }
@keyframes op { from { opacity: 0; transform: translate(-50%, 20px); } }
.schud { animation: schud .35s; }
@keyframes schud { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
/* Koppelspel */
.koppel { display: grid; grid-template-columns: 1fr 1.6fr; gap: .6em; }
.koppel .optie { font-size: .92em; }
/* Tijdlijn */
.tl-slot { display: flex; gap: .7em; align-items: center; border: 2px dashed var(--rand); border-radius: 14px; padding: .5em .8em; min-height: 2.8em; margin-bottom: .4em; background: #fafbff; }
.tl-slot .nr { font-weight: 700; color: var(--blauw); width: 1.6em; }
.tl-slot.goed { border-style: solid; border-color: var(--goed); background: var(--goed-l); }
.tl-slot.fout { border-style: solid; border-color: var(--fout); background: var(--fout-l); }
/* Neuron */
.mail { display: grid; grid-template-columns: 1fr auto auto; gap: .5em; align-items: center; padding: .45em .7em; border-radius: 12px; border: 2px solid var(--rand); margin-bottom: .35em; font-size: .9em; }
.mail.ok { border-color: var(--goed); background: var(--goed-l); }
.mail.nok { border-color: var(--fout); background: var(--fout-l); }
.mail .kenm { color: var(--zacht); font-size: .8em; }
.schuif { display: grid; grid-template-columns: 1fr 140px 3.2em; gap: .6em; align-items: center; margin: .35em 0; }
.schuif input { width: 100%; }
.schuif b { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .schuif { grid-template-columns: 1fr; gap: .1em; } .schuif b { text-align: left; } }
.formule { font-family: ui-monospace, Menlo, Consolas, monospace; background: #f1f3fa; padding: .5em .8em; border-radius: 10px; font-size: .85em; overflow-x: auto; }
/* Volgende woord */
.zinnetje { font-size: 1.3em; font-weight: 600; }
.zinnetje .gat { display: inline-block; min-width: 4em; border-bottom: 3px solid var(--blauw); color: var(--blauw); }
.kans { display: grid; grid-template-columns: 7em 1fr 4em; gap: .6em; align-items: center; margin: .3em 0; }
.kans .balk { height: 20px; }
.kans .balk > div { background: linear-gradient(90deg, #6c8cff, #7b4ce0); }
.kans b { text-align: right; font-variant-numeric: tabular-nums; }
/* Woordenboek */
.zoek { width: 100%; font: inherit; padding: .55em .9em; border-radius: 14px; border: 2px solid var(--rand); }
.term { padding: .6em 0; border-bottom: 1px solid var(--rand); }
.term b { color: var(--blauw-d); }
/* Diploma */
.diploma { text-align: center; border: 8px double #c9a227; background: #fffdf3; padding: 2em 1em; }
.diploma .groot-ico { font-size: 3.5em; }
input[type=text] { font: inherit; padding: .45em .8em; border-radius: 12px; border: 2px solid var(--rand); width: 100%; max-width: 360px; }
#confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
.snipper { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: val linear forwards; }
@keyframes val { to { transform: translateY(110vh) rotate(720deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <button id="home" aria-label="Naar het begin" hidden>🏠</button>
  <div class="titel" id="titel">🤖 AI-Academie</div>
  <div class="xp-pil" title="Je ervaringspunten">⚡ <span id="xp">0</span> XP</div>
  <button id="groter" aria-label="Tekst groter of kleiner" title="Tekst groter/kleiner">A±</button>
</header>
<main id="app"></main>
<div id="confetti" aria-hidden="true"></div>

<script>
"use strict";
// =====================================================================
//  LESSTOF – alle vragen, begrippen en weetjes
// =====================================================================
const THEMAS = {
  basis:   { naam: "De basis: wat is AI?",        ico: "🧠" },
  leren:   { naam: "Hoe leert een machine?",      ico: "📈" },
  taal:    { naam: "ChatGPT & taalmodellen",      ico: "💬" },
  beeld:   { naam: "Beeld, stem & deepfakes",     ico: "🎨" },
  praktijk:{ naam: "AI in je werk & leven",       ico: "💼" },
  ethiek:  { naam: "Risico's, ethiek & wetgeving",ico: "⚖️" },
  historie:{ naam: "Geschiedenis van AI",         ico: "📜" },
};

// v = vraag, a = antwoorden (eerste is GOED – wordt later geschud), u = uitleg
const VRAGEN = {
basis: [
 { v: "Waar staat de afkorting AI voor?", a: ["Artificial Intelligence – kunstmatige intelligentie", "Automatische Informatieverwerking", "Analoge Interface", "Advanced Internet"],
   u: "AI = Artificial Intelligence. Het zijn computersystemen die taken doen waarvoor je normaal menselijke intelligentie nodig hebt: taal begrijpen, beelden herkennen, voorspellen of beslissen." },
 { v: "Wat is de relatie tussen AI en machine learning?", a: ["Machine learning is een onderdeel van AI: het systeem leert van voorbeelden in plaats van vaste regels", "Het is precies hetzelfde", "AI is een onderdeel van machine learning", "Machine learning is de hardware, AI de software"],
   u: "Zie het als Russische poppetjes: AI is het grote geheel, machine learning zit erin, en deep learning zit weer in machine learning." },
 { v: "Welke van deze is GEEN AI?", a: ["Een gewone rekenmachine", "Gezichtsherkenning op je telefoon", "De spamfilter van je e-mail", "Aanbevelingen op Netflix"],
   u: "Een rekenmachine volgt vaste rekenregels en leert niets. Gezichtsherkenning, spamfilters en aanbevelingen zijn getraind op enorme hoeveelheden voorbeelden." },
 { v: "Wat bedoelt men met ‘smalle AI’ (narrow AI)?", a: ["AI die erg goed is in één specifieke taak", "AI die alleen op kleine schermen werkt", "AI met weinig geheugen", "AI die maar één taal spreekt"],
   u: "Bijna alle AI is ‘smal’: een schaakcomputer kan niet autorijden en een spamfilter kan geen gedicht schrijven. Grote taalmodellen zijn wel breder inzetbaar dan klassieke AI." },
 { v: "Wat is AGI?", a: ["Algemene AI die vrijwel elke denktaak minstens zo goed kan als een mens", "Een Amerikaans overheidsbureau voor AI", "Een programmeertaal voor AI", "Een type computerchip"],
   u: "AGI = Artificial General Intelligence. Grote AI-bedrijven noemen het hun doel. Wanneer (en of) het er komt, en hoe je het zou herkennen, is onder deskundigen sterk omstreden." },
 { v: "Wat is een algoritme?", a: ["Een stappenplan: een reeks instructies om een probleem op te lossen", "Een soort robot", "Een computervirus", "Een database met wachtwoorden"],
   u: "Een recept is ook een algoritme! In AI bepaalt het algoritme hoe het model leert van data." },
 { v: "Wat is deep learning?", a: ["Machine learning met neurale netwerken die uit heel veel lagen bestaan", "AI die onder water werkt", "Leren door heel lang naar één voorbeeld te kijken", "Een filosofische stroming"],
   u: "‘Deep’ slaat op de vele lagen in het netwerk. Elke laag herkent iets abstracters: eerst randjes, dan vormen, dan ‘een kat’." },
 { v: "Wat heeft een AI-model vooral nodig om te leren?", a: ["Veel voorbeelden (data)", "Een internetverbinding", "Een programmeur die elke regel uitschrijft", "Een camera"],
   u: "Data is de brandstof van AI. Een taalmodel leert van enorme hoeveelheden tekst, een beeldherkenner van miljoenen foto's." },
 { v: "Wat is generatieve AI?", a: ["AI die nieuwe inhoud maakt: tekst, beelden, muziek, video of code", "AI die stroom opwekt", "AI van een bepaalde generatie computers", "AI die alleen dingen sorteert"],
   u: "ChatGPT, Claude, Gemini (tekst) en Midjourney of DALL·E (beeld) zijn bekende voorbeelden van generatieve AI." },
 { v: "Heeft een chatbot zoals ChatGPT bewustzijn of gevoelens?", a: ["Daar is geen wetenschappelijk bewijs voor; het herkent en produceert patronen in taal", "Ja, dat is bewezen", "Ja, maar alleen als je vriendelijk bent", "Alleen de betaalde versie"],
   u: "Een taalmodel kan heel menselijk klinken omdat het van menselijke teksten leerde. Of zulke systemen ooit iets als ervaring kunnen hebben is een open filosofische vraag – maar ‘het klinkt menselijk’ is geen bewijs." },
],
leren: [
 { v: "Wat is ‘supervised learning’ (gecontroleerd leren)?", a: ["Leren van voorbeelden waarbij het juiste antwoord (label) erbij staat", "Leren terwijl een mens meekijkt via de webcam", "Leren zonder data", "Leren door straf en beloning"],
   u: "Voorbeeld: 10.000 mails met het label ‘spam’ of ‘geen spam’. Het model leert de patronen die bij elk label horen." },
 { v: "Wat doet ‘unsupervised learning’?", a: ["Zelf patronen en groepen ontdekken in data zonder labels", "Leren zonder stroom", "Alleen leren ’s nachts", "Fouten negeren"],
   u: "Bijvoorbeeld een supermarkt die klanten automatisch in groepen indeelt op basis van koopgedrag, zonder van tevoren te zeggen welke groepen er zijn." },
 { v: "Hoe werkt ‘reinforcement learning’?", a: ["Uitproberen en leren van beloning en straf", "Data versterken met extra opslag", "Twee modellen samenvoegen", "Leren van een leraar die alles voorzegt"],
   u: "Net als een hond trainen met snoepjes. Zo leerde AlphaGo Go spelen door miljoenen partijen tegen zichzelf te spelen." },
 { v: "Wat is ‘overfitting’?", a: ["Het model leert de trainingsvoorbeelden uit het hoofd en werkt slecht op nieuwe gevallen", "Het model is te groot voor de computer", "Het model is te snel klaar", "Het model past niet in de cloud"],
   u: "Zoals een leerling die de oefentoets uit het hoofd leert maar de echte toets niet snapt. Daarom test je altijd op data die het model nog niet gezien heeft." },
 { v: "Waarom houd je een deel van de data apart als ‘testset’?", a: ["Om eerlijk te meten hoe goed het model werkt op onbekende voorbeelden", "Als reserve voor als de computer crasht", "Omdat het anders te duur is", "Dat is wettelijk verplicht"],
   u: "Wie zijn eigen examen nakijkt met de antwoorden die hij al kende, krijgt een te mooi cijfer. Een testset voorkomt dat." },
 { v: "Waar is een kunstmatig neuraal netwerk losjes op geïnspireerd?", a: ["Op de zenuwcellen in de hersenen", "Op het wegennet", "Op een spinnenweb", "Op het internet"],
   u: "Kunstmatige ‘neuronen’ tellen signalen op met bepaalde gewichten en geven een signaal door. De gelijkenis met echte hersenen is wel beperkt." },
 { v: "Wat zijn ‘gewichten’ (weights) in een neuraal netwerk?", a: ["Getallen die bepalen hoe zwaar elke invoer meetelt; die worden tijdens training aangepast", "Het gewicht van de server in kilo's", "De prijs per vraag", "Het aantal gebruikers"],
   u: "Training = de gewichten stapje voor stapje bijstellen zodat de fouten kleiner worden. Probeer het zelf in het spel ‘Bouw een spamfilter’!" },
 { v: "Wat betekent ‘garbage in, garbage out’?", a: ["Slechte of scheve data levert een slecht model op", "AI kan afval sorteren", "Oude computers moet je weggooien", "Verwijderde bestanden komen terug"],
   u: "Een model is nooit beter dan zijn data. Zit er een vooroordeel in de data, dan neemt het model dat over." },
 { v: "Waarom zijn GPU's (grafische chips) zo belangrijk voor AI?", a: ["Ze kunnen enorm veel eenvoudige berekeningen tegelijk doen", "Ze maken mooiere plaatjes van de AI", "Ze zijn goedkoper dan gewone processors", "Ze slaan meer data op"],
   u: "Ooit gemaakt voor games, nu de motor van AI. Daardoor werd chipmaker Nvidia een van de waardevolste bedrijven ter wereld. Ook het Nederlandse ASML is cruciaal: het maakt de machines om zulke chips te produceren." },
 { v: "Wat is het verschil tussen ‘training’ en ‘inferentie’?", a: ["Training = het model leren; inferentie = het getrainde model gebruiken om antwoorden te geven", "Training is gratis, inferentie niet", "Het is hetzelfde", "Inferentie is het testen door mensen"],
   u: "Training van een groot model kost maanden en vele miljoenen. Elke keer dat jij een vraag stelt, is dat inferentie." },
 { v: "Een groot taalmodel heeft ‘honderden miljarden parameters’. Wat zijn dat?", a: ["De instelbare getallen (gewichten) in het model", "Het aantal woorden dat het kent", "Het aantal gebruikers", "Het aantal servers"],
   u: "Parameters en gewichten zijn grofweg hetzelfde. Meer parameters betekent meestal dat het model complexere patronen kan leren – maar ook dat het duurder is." },
],
taal: [
 { v: "Waar staat LLM voor?", a: ["Large Language Model – groot taalmodel", "Lokaal Lerend Model", "Linked Logic Machine", "Low Latency Mode"],
   u: "Een LLM is getraind op gigantische hoeveelheden tekst. ChatGPT, Claude, Gemini en Llama zijn gebouwd op LLM's." },
 { v: "Wat doet een taalmodel in de kern?", a: ["Steeds voorspellen welk stukje tekst (token) waarschijnlijk volgt", "Antwoorden opzoeken in een grote database", "Elk antwoord kopiëren van Wikipedia", "Een mens typt stiekem mee"],
   u: "Het model rekent per stap uit welk volgend token het meest passend is. Door dat duizenden keren te herhalen ontstaat een heel antwoord. Speel ‘Raad het volgende woord’!" },
 { v: "Wat is een ‘token’?", a: ["Een stukje tekst: een woord of deel van een woord", "Een betaalmunt voor AI", "Een wachtwoord", "Een foutmelding"],
   u: "‘Onvoorstelbaar’ kan in meerdere tokens worden opgeknipt. Daardoor zijn taalmodellen soms slecht in letters tellen: ze ‘zien’ geen losse letters." },
 { v: "Waar staat GPT (zoals in ChatGPT) voor?", a: ["Generative Pre-trained Transformer", "General Purpose Technology", "Google Powered Text", "Global Prediction Tool"],
   u: "Generative = maakt tekst, Pre-trained = eerst getraind op heel veel tekst, Transformer = het type neuraal netwerk (uitgevonden in 2017)." },
 { v: "Wat bedoelt men met ‘hallucineren’ bij AI?", a: ["Overtuigend klinkende informatie verzinnen die niet klopt", "De AI ziet beelden die er niet zijn", "De AI loopt vast", "De AI praat in een andere taal"],
   u: "Een taalmodel wil altijd een vloeiend antwoord geven, ook als het het niet weet. Controleer dus altijd feiten, bronnen, cijfers en citaten." },
 { v: "Wat is het ‘contextvenster’?", a: ["Hoeveel tekst het model in één keer kan meenemen in een gesprek", "Het chatvenster op je scherm", "De tijd die het model nodig heeft", "Het venster met instellingen"],
   u: "Alles wat binnen het contextvenster past (jouw vragen, documenten, eerdere antwoorden) kan het model gebruiken. Wat erbuiten valt, ‘vergeet’ het." },
 { v: "Wat is een ‘prompt’?", a: ["De opdracht of vraag die je aan de AI geeft", "Een snelle AI", "Het antwoord van de AI", "Een abonnement"],
   u: "Hoe beter je prompt (context, doel, gewenste vorm), hoe beter het antwoord. Oefen dit in ‘Prompt-coach’." },
 { v: "Wat doet de instelling ‘temperatuur’ bij een taalmodel?", a: ["Bepaalt hoe voorspelbaar of juist creatief/willekeurig de woordkeuze is", "Regelt de koeling van de server", "Bepaalt hoe vriendelijk het model is", "Bepaalt de snelheid"],
   u: "Lage temperatuur: kiest bijna altijd het meest waarschijnlijke woord (saai maar betrouwbaar). Hoge temperatuur: meer verrassing, maar ook meer onzin." },
 { v: "Wat is RLHF?", a: ["Bijtrainen met menselijke feedback: mensen beoordelen antwoorden en het model leert daarvan", "Een snelle internetverbinding", "Een Europese AI-wet", "Een type chip"],
   u: "Reinforcement Learning from Human Feedback. Hierdoor werd een ruwe tekstvoorspeller een behulpzame assistent die vragen beantwoordt in plaats van alleen tekst aan te vullen." },
 { v: "Waarom weet een chatbot soms niets van recent nieuws?", a: ["Zijn kennis stopt bij de datum waarop de trainingsdata is verzameld, tenzij hij kan zoeken op internet", "Nieuws is verboden voor AI", "Hij wil het niet zeggen", "Nieuws staat in een andere taal"],
   u: "Dit heet de ‘knowledge cutoff’. Veel chatbots kunnen tegenwoordig wel het web doorzoeken om actuele informatie op te halen." },
 { v: "Wat is RAG (Retrieval-Augmented Generation)?", a: ["De AI zoekt eerst relevante documenten op en baseert het antwoord daarop", "Een methode om AI sneller te laten typen", "Een manier om AI te hacken", "Een virus voor taalmodellen"],
   u: "Bedrijven gebruiken dit om een chatbot vragen te laten beantwoorden over hun eigen handleidingen of beleid. Het vermindert hallucinaties, maar sluit ze niet uit." },
 { v: "Wat is een ‘AI-agent’?", a: ["AI die zelfstandig meerdere stappen uitvoert en hulpmiddelen gebruikt om een doel te bereiken", "Een geheim agent die AI gebruikt", "Een verkoper van AI-software", "Een virusscanner"],

 { v: "Welke van deze is GEEN AI-chatbot of taalmodel?", a: ["Excel", "Claude (Anthropic)", "Gemini (Google)", "ChatGPT (OpenAI)"],

const rnd = (n) => Math.floor(Math.random() * n);
const schud = (l) => { const a = l.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function h(tag, eig = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(eig || {})) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
}

const SLEUTEL = "ai-academie-v1";

function bewaar() { try { localStorage.setItem(SLEUTEL, JSON.stringify(S)); } catch (e) {} document.getElementById("xp").textContent = S.xp; }

function rang(xp = S.xp) {
  let r = RANGEN[0], volgende = null;
  for (let i = 0; i < RANGEN.length; i++) if (xp >= RANGEN[i][0]) { r = RANGEN[i]; volgende = RANGEN[i + 1] || null; }
  return { ico: r[1], naam: r[2], van: r[0], tot: volgende ? volgende[0] : null, volgendeNaam: volgende ? volgende[2] : null };
}
function toast(t) {
  const e = h("div", { class: "toast" }, t); document.body.append(e); setTimeout(() => e.remove(), 2200);
}
function geefXP(n) {
  const oud = rang().naam; S.xp += n; bewaar();
  const nieuw = rang();
  if (nieuw.naam !== oud) { toast(`${nieuw.ico} Nieuwe rang: ${nieuw.naam}!`); confetti(); }
}
function confetti(n = 70) {
  const c = document.getElementById("confetti"); const kl = ["#2f5bea", "#7b4ce0", "#ffd34d", "#1f9d55", "#ff6b6b"];
  for (let i = 0; i < n; i++) {
    const s = h("div", { class: "snipper" });
    s.style.left = Math.random() * 100 + "vw"; s.style.background = kl[rnd(kl.length)];
    s.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; s.style.animationDelay = Math.random() * .4 + "s";
    c.append(s); setTimeout(() => s.remove(), 4200);
  }
}
let ctx = null;
function piep(goed) {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const tonen = goed ? [660, 880] : [220, 180];
    tonen.forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(.12, ctx.currentTime + i * .1); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + i * .1 + .25);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + i * .1); o.stop(ctx.currentTime + i * .1 + .3); });
  } catch (e) {}
}
function scherm(titel) {
  $app.innerHTML = ""; window.scrollTo(0, 0);
  document.getElementById("titel").textContent = titel || "🤖 AI-Academie";

function record(spel, score) { if (!(S.records[spel] >= score)) { S.records[spel] = score; bewaar(); return true; } return false; }
function aantalBeheerst(thema) { return ALLE_VRAGEN.filter((q) => (!thema || q.thema === thema) && S.beheerst[q.id]).length; }

// items: [{ v, a:[goed, ...fout], u, id?, label? }]
function speelVragen({ titel, spel, items, xpPerGoed = 10, naEinde }) {
  let i = 0, score = 0;
  const volgende = () => {
    if (i >= items.length) return eindScherm();
    const q = items[i];
    const opties = q.vast ? q.a : schud(q.a);
    const juist = q.goed || q.a[0];
    scherm(titel);
    const uitleg = h("div");
    const verder = h("button", { class: "knop", hidden: true, onclick: () => { i++; volgende(); } }, i + 1 < items.length ? "Volgende →" : "Bekijk resultaat");
    const knoppen = opties.map((o) => h("button", { class: "optie", onclick: () => kies(o) }, o));
    function kies(o) {
      const goed = o === juist;
      knoppen.forEach((k) => { k.disabled = true; if (k.textContent === juist) k.classList.add("goed"); else if (k.textContent === o) k.classList.add("fout"); });
      piep(goed);
      if (goed) { score++; geefXP(xpPerGoed); if (q.id) { S.beheerst[q.id] = true; bewaar(); } }
      uitleg.replaceWith(h("div", { class: "uitleg " + (goed ? "goed" : "fout") },
        h("b", {}, goed ? "✅ Goed zo! " : "❌ Helaas. "), !goed && !q.vast ? h("span", {}, `Het juiste antwoord: ${juist}. `) : null, h("br"), q.u));
      verder.hidden = false; verder.focus();
    }
    $app.append(h("div", { class: "kaart" },
      h("div", { class: "voortgang" }, h("span", {}, `Vraag ${i + 1} van ${items.length}`), h("span", {}, `✅ ${score}`)),
      h("div", { class: "balk" }, h("div", { style: `width:${(i / items.length) * 100}%` })),
      q.label ? h("p", { style: "margin-top:.8em" }, h("span", { class: "label" }, q.label)) : null,
      h("h2", { style: "margin-top:.6em" }, q.v),
      h("div", { class: "opties" }, knoppen), uitleg, h("div", { class: "knoppen" }, verder)));
  };
  const eindScherm = () => {
    scherm(titel);
    const nieuwRecord = record(spel, score);
    const pct = score / items.length;
    if (pct >= .8) confetti();
    const extra = naEinde ? naEinde(score) : null;
    $app.append(h("div", { class: "kaart", style: "text-align:center" },
      h("div", { style: "font-size:3em" }, pct >= .8 ? "🏆" : pct >= .5 ? "👍" : "📚"),
      h("h1", {}, `${score} van ${items.length} goed`),
      h("p", {}, pct >= .8 ? "Uitstekend! Je weet hier echt veel van." : pct >= .5 ? "Prima! Nog een rondje en je zit erboven." : "Goed bezig – elke fout is een les. Lees de uitleg en probeer het nog eens."),
      nieuwRecord && score > 0 ? h("p", {}, "🎉 Nieuw record!") : null,
      h("p", { class: "zacht" }, `${rang().ico} ${rang().naam} · ${S.xp} XP`),
      extra,
      h("div", { class: "knoppen", style: "justify-content:center" },
        h("button", { class: "knop", onclick: () => speelVragen({ titel, spel, items: schud(items), xpPerGoed, naEinde }) }, "Nog een keer"),
        h("button", { class: "knop wit", onclick: start }, "Naar het menu"))));
  };
  volgende();
}

function kiesVragen(thema, n) {
  const pool = ALLE_VRAGEN.filter((q) => !thema || q.thema === thema);
  const nieuw = schud(pool.filter((q) => !S.beheerst[q.id])), oud = schud(pool.filter((q) => S.beheerst[q.id]));
  return nieuw.concat(oud).slice(0, n).map((q) => ({ ...q, label: THEMAS[q.thema].ico + " " + THEMAS[q.thema].naam }));
}

  speelVragen({ titel: "🕵️ Waar of fabel?", spel: "fabel", items, xpPerGoed: 8 });
}

// =====================================================================
//  KOPPELSPEL
// =====================================================================
function koppelSpel() {
  const set = schud(BEGRIPPEN).slice(0, 6);
  let gekozen = null, fouten = 0, klaar = 0;
  scherm("🔗 Begrippen koppelen");
  const status = h("p", { class: "zacht" }, "Tik op een begrip en daarna op de bijpassende betekenis.");
  const links = set.map(([t]) => h("button", { class: "optie", onclick: (e) => kiesTerm(t, e.currentTarget) }, h("b", {}, t)));
  const rechts = schud(set).map(([t, d]) => h("button", { class: "optie", "data-t": t, onclick: (e) => kiesDef(t, e.currentTarget) }, d));
  function kiesTerm(t, el) { links.forEach((k) => k.classList.remove("gekozen")); gekozen = { t, el }; el.classList.add("gekozen"); }
  function kiesDef(t, el) {
    if (!gekozen) { status.textContent = "Kies eerst links een begrip."; return; }
    if (gekozen.t === t) {
      piep(true); [gekozen.el, el].forEach((k) => { k.classList.remove("gekozen"); k.classList.add("goed"); k.disabled = true; });
      gekozen = null; klaar++;
      if (klaar === set.length) einde();
    } else {
      piep(false); fouten++; el.classList.add("schud"); setTimeout(() => el.classList.remove("schud"), 400);
      status.textContent = `Dat past niet. Fouten: ${fouten}`;
    }
  }
  function einde() {
    const score = Math.max(0, 6 - fouten);
    geefXP(10 + score * 5); record("koppel", score); if (fouten === 0) confetti();
    status.replaceWith(h("div", { class: "uitleg goed" }, h("b", {}, fouten === 0 ? "🎯 Foutloos! " : "✅ Allemaal gekoppeld! "), `Je maakte ${fouten} fout${fouten === 1 ? "" : "en"}. +${10 + score * 5} XP`));
    $app.querySelector(".kaart").append(h("div", { class: "knoppen" },
      h("button", { class: "knop", onclick: koppelSpel }, "Nieuwe begrippen"), h("button", { class: "knop wit", onclick: start }, "Naar het menu")));
  }
  $app.append(h("div", { class: "kaart" }, status, h("div", { class: "koppel" }, h("div", { class: "opties" }, links), h("div", { class: "opties" }, rechts))));
}

// =====================================================================
//  DENK ALS CHATGPT – volgende woord + temperatuur
// =====================================================================
function volgendWoord() {
  const rondes = schud(VOLGENDE).slice(0, 5);
  let i = 0, score = 0, T = 1;
  const kansenBij = (o, temp) => {
    const w = o.map(([, p]) => Math.pow(Math.max(p, 1e-6), 1 / temp)); const som = w.reduce((a, b) => a + b, 0);
    return w.map((x) => x / som * 100);
  };
  function ronde() {
    if (i >= rondes.length) return einde();
    const r = rondes[i]; const o = r.o.slice().sort((a, b) => b[1] - a[1]); const top = o[0][0];
    scherm("🔮 Denk als ChatGPT");
    const gat = h("span", { class: "gat" }, "…");
    const vak = h("div");
    const knoppen = schud(o).map(([w]) => h("button", { class: "optie", onclick: () => kies(w) }, w));
    function kies(w) {
      const goed = w === top; piep(goed); if (goed) { score++; geefXP(10); }
      knoppen.forEach((k) => { k.disabled = true; if (k.textContent === top) k.classList.add("goed"); else if (k.textContent === w) k.classList.add("fout"); });
      gat.textContent = top;
      const balken = h("div");
      const tekenBalken = () => balken.replaceChildren(...kansenBij(o, T).map((p, j) =>
        h("div", { class: "kans" }, h("span", {}, o[j][0]), h("div", { class: "balk" }, h("div", { style: `width:${p}%` })), h("b", {}, p < 1 ? p.toFixed(1) + "%" : Math.round(p) + "%"))));
      const tLabel = h("b", {}, T.toFixed(1));
      const uitkomst = h("p");
      const schuif = h("input", { type: "range", min: "0.1", max: "2", step: "0.1", value: String(T), oninput: (e) => { T = +e.target.value; tLabel.textContent = T.toFixed(1); tekenBalken(); } });
      const dobbel = () => {
        const k = kansenBij(o, T); let x = Math.random() * 100, j = 0; while (j < k.length - 1 && (x -= k[j]) > 0) j++;
        uitkomst.replaceChildren("🎲 Het model kiest: ", h("b", {}, `“${r.z} ${o[j][0]}”`));
      };
      tekenBalken();
      vak.replaceWith(h("div", { class: "uitleg " + (goed ? "goed" : "fout") },
        h("b", {}, goed ? "✅ Precies wat het model ook zou kiezen! " : `❌ Het meest waarschijnlijke woord is „${top}”. `),
        h("p", {}, "Zo ziet de kansverdeling van een taalmodel eruit (voorbeeldcijfers):"), balken,
        h("div", { class: "schuif" }, h("span", {}, "🌡️ Temperatuur"), schuif, tLabel),
        h("p", { class: "klein" }, "Schuif naar links (laag): het model kiest bijna altijd het populairste woord. Naar rechts (hoog): de kansen worden gelijker en het model wordt creatiever – of onzinniger."),
        h("button", { class: "knop wit", onclick: dobbel }, "🎲 Laat het model kiezen"), uitkomst));
      verder.hidden = false;
    }
    const verder = h("button", { class: "knop", hidden: true, onclick: () => { i++; ronde(); } }, i + 1 < rondes.length ? "Volgende zin →" : "Resultaat");
    $app.append(h("div", { class: "kaart" },
      h("div", { class: "voortgang" }, h("span", {}, `Zin ${i + 1} van ${rondes.length}`), h("span", {}, `✅ ${score}`)),
      h("p", { class: "zacht" }, "Een taalmodel doet niets anders dan steeds het volgende stukje tekst voorspellen. Welk woord vindt het model het meest waarschijnlijk?"),
      h("p", { class: "zinnetje" }, r.z + " ", gat),
      h("div", { class: "twee" }, knoppen), vak, h("div", { class: "knoppen" }, verder)));
  }
  function einde() {
    scherm("🔮 Denk als ChatGPT"); record("woord", score); if (score >= 4) confetti();
    $app.append(h("div", { class: "kaart" },
      h("h1", {}, `${score} van ${rondes.length} goed voorspeld`),
      h("h3", {}, "Wat heb je net geleerd?"),
      h("p", {}, "• Een taalmodel ‘weet’ niet wat waar is: het berekent wat het meest waarschijnlijk volgt, op basis van miljarden zinnen die het tijdens training zag."),
      h("p", {}, "• Een volledig antwoord ontstaat door dit woord-voor-woord (eigenlijk token-voor-token) te herhalen."),
      h("p", {}, "• Daarom klinkt het altijd vloeiend, ook als het onzin is: zo ontstaan hallucinaties."),
      h("p", {}, "• Met de temperatuur stel je in hoe voorspelbaar of creatief die keuzes zijn."),
      h("div", { class: "knoppen" }, h("button", { class: "knop", onclick: volgendWoord }, "Nog een keer"), h("button", { class: "knop wit", onclick: start }, "Naar het menu"))));
  }
  ronde();
}

// =====================================================================
//  BOUW EEN SPAMFILTER – een echt perceptron
// =====================================================================
const MAILS = [
 { o: "Vergadering verplaatst naar dinsdag", x: [0, 0, 1], spam: false },
 { o: "GRATIS iPhone!!!! Klik nu", x: [4, 1, 0], spam: true },
 { o: "U heeft GEWONNEN! Claim uw prijs", x: [2, 1, 0], spam: true },
 { o: "Foto's van de verjaardag!", x: [1, 0, 1], spam: false },
 { o: "Gratis parkeren bij de club zaterdag", x: [0, 1, 1], spam: false },
 { o: "Laatste kans!!! Uw pakket wacht", x: [3, 0, 0], spam: true },
 { o: "Hoera!! Gefeliciteerd met je verjaardag!", x: [2, 0, 1], spam: false },
 { o: "Uw account wordt geblokkeerd!", x: [1, 0, 0], spam: true },
 { o: "Offerte aangevraagd via de website", x: [0, 0, 0], spam: false },
];
const KENMERKEN = ["Aantal uitroeptekens", "Bevat ‘gratis’ of ‘gewonnen’", "Afzender staat in je contacten"];
function neuronSpel() {
  let w = [0, 0, 0], d = 0, gehaald = false, bezig = false;
  scherm("🧪 Bouw een spamfilter");
  const lijst = h("div"), scoreEl = h("h3"), formule = h("div", { class: "formule" });
  const schuiven = [];
  const maakSchuif = (label, min, max, get, set) => {
    const waarde = h("b", {}, get().toFixed(1));
    const inp = h("input", { type: "range", min, max, step: "0.5", value: String(get()), oninput: (e) => { set(+e.target.value); teken(); } });
    schuiven.push({ inp, waarde, get });
    return h("div", { class: "schuif" }, h("span", {}, label), inp, waarde);
  };
  const somVan = (m) => m.x.reduce((s, x, k) => s + x * w[k], 0);
  function teken() {
    schuiven.forEach((s) => { s.inp.value = String(s.get()); s.waarde.textContent = s.get().toFixed(1); });
    let goed = 0;
    lijst.replaceChildren(...MAILS.map((m) => {
      const som = somVan(m), voorspelt = som > d, ok = voorspelt === m.spam; if (ok) goed++;
      return h("div", { class: "mail " + (ok ? "ok" : "nok") },
        h("div", {}, h("div", {}, m.o), h("div", { class: "kenm" }, `❗${m.x[0]} · gratis/gewonnen: ${m.x[1] ? "ja" : "nee"} · bekend: ${m.x[2] ? "ja" : "nee"} · score ${som.toFixed(1)}`)),
        h("span", { class: "klein" }, voorspelt ? "🚫 spam" : "📥 inbox"),
        h("span", {}, ok ? "✅" : "❌"));
    }));
    scoreEl.textContent = `${goed} van ${MAILS.length} mails goed gesorteerd`;
    formule.textContent = `score = ${w[0].toFixed(1)} × uitroeptekens + ${w[1].toFixed(1)} × gratis + ${w[2].toFixed(1)} × bekend  →  spam als score > ${d.toFixed(1)}`;
    if (goed === MAILS.length && !gehaald && !bezig) {
      gehaald = true; confetti(); geefXP(50); record("neuron", MAILS.length);
      toast("🎉 Perfecte spamfilter! +50 XP");
    }
  }
  function train() {
    if (bezig) return; bezig = true; let ronde = 0; const lr = 0.5;
    log.textContent = "";
    const stap = () => {
      ronde++; let fouten = 0;
      for (const m of MAILS) {
        const voorspelt = somVan(m) > d ? 1 : 0, echt = m.spam ? 1 : 0, fout = echt - voorspelt;
        if (fout !== 0) { fouten++; w = w.map((wk, k) => wk + lr * fout * m.x[k]); d -= lr * fout; }
      }
      log.textContent = fouten ? `Trainingsronde ${ronde}: ${fouten} fout${fouten === 1 ? "" : "en"} gevonden → gewichten bijgesteld.` : `Trainingsronde ${ronde}: geen fouten meer.`;
      teken();
      if (fouten > 0 && ronde < 60) setTimeout(stap, 650);
      else { bezig = false; log.textContent += fouten === 0 ? " Klaar, alle mails goed! Dit is precies wat ‘trainen’ betekent." : ""; teken(); }
    };
    stap();
  }
  const log = h("p", { class: "klein zacht" });
  $app.append(
    h("div", { class: "kaart" },
      h("h2", {}, "Jij bent nu een AI-ontwikkelaar"),
      h("p", {}, "Dit is één kunstmatig neuron – het bouwsteentje van elk neuraal netwerk, ook van ChatGPT. Het geeft elk kenmerk van een mail een ", h("b", {}, "gewicht"), ", telt alles op en vergelijkt de score met een ", h("b", {}, "drempel"), "."),
      h("p", {}, h("b", {}, "Opdracht:"), " stel de schuifjes zo in dat alle 9 mails goed gesorteerd worden. Lukt het niet? Laat de computer zelf ", h("i", {}, "leren"), "."),
      maakSchuif("⚖️ Gewicht: " + KENMERKEN[0], -5, 5, () => w[0], (v) => w[0] = v),
      maakSchuif("⚖️ Gewicht: " + KENMERKEN[1], -5, 5, () => w[1], (v) => w[1] = v),
      maakSchuif("⚖️ Gewicht: " + KENMERKEN[2], -5, 5, () => w[2], (v) => w[2] = v),
      maakSchuif("🚧 Drempel", -5, 8, () => d, (v) => d = v),
      formule,
      h("div", { class: "knoppen" },
        h("button", { class: "knop", onclick: train }, "🤖 Laat de AI zelf leren"),
        h("button", { class: "knop wit", onclick: () => { w = [0, 0, 0]; d = 0; gehaald = false; log.textContent = ""; teken(); } }, "↺ Reset")),
      log),
    h("div", { class: "kaart" }, scoreEl, lijst),
    h("div", { class: "kaart" },
      h("h3", {}, "💡 Wat leer je hiervan?"),
      h("p", {}, "• ", h("b", {}, "Trainen"), " = automatisch de gewichten bijstellen bij elke fout, net zo lang tot het model klopt. Dat deed de knop ‘Laat de AI zelf leren’ (dit heet de perceptron-regel, uit 1958)."),
      h("p", {}, "• Een negatief gewicht bij ‘bekende afzender’ betekent: dat maakt spam ", h("i", {}, "minder"), " waarschijnlijk."),
      h("p", {}, "• ChatGPT werkt met hetzelfde principe, maar dan met honderden miljarden gewichten in vele lagen, getraind op enorme hoeveelheden tekst."),
      h("p", {}, "• Het filter is zo goed als zijn voorbeelden: met andere of scheve mails leert het iets anders (", h("b", {}, "bias"), ").")));
  teken();
}

// =====================================================================
//  TIJDLIJN
// =====================================================================
function tijdlijn() {
  const set = schud(MIJLPALEN).slice(0, 5); const juist = set.slice().sort((a, b) => a.j - b.j);
  let volgorde = [];
  scherm("📜 Tijdlijn");
  const slots = h("div"), kaartjes = h("div", { class: "opties" }), knoppen = h("div", { class: "knoppen" });
  function teken() {
    slots.replaceChildren(...set.map((_, k) => h("div", { class: "tl-slot" }, h("span", { class: "nr" }, k + 1 + "."), volgorde[k] ? volgorde[k].t : h("span", { class: "zacht" }, "…"))));
    kaartjes.replaceChildren(...set.filter((m) => !volgorde.includes(m)).map((m) => h("button", { class: "optie", onclick: () => { volgorde.push(m); teken(); } }, m.t)));
    knoppen.replaceChildren(
      h("button", { class: "knop", disabled: volgorde.length < set.length, onclick: controleer }, "Controleer"),
      h("button", { class: "knop wit", disabled: !volgorde.length, onclick: () => { volgorde.pop(); teken(); } }, "↶ Ongedaan maken"));
  }
  function controleer() {
    let goed = 0;
    slots.replaceChildren(...juist.map((m, k) => {
      const ok = volgorde[k] === m; if (ok) goed++;
      return h("div", { class: "tl-slot " + (ok ? "goed" : "fout") }, h("span", { class: "nr" }, m.j), h("span", {}, m.t, ok ? " ✅" : h("span", { class: "zacht klein" }, ` (jij had hier: ${volgorde[k].t})`)));
    }));
    kaartjes.replaceChildren(); piep(goed === set.length);
    geefXP(goed * 8); record("tijdlijn", goed); if (goed === set.length) confetti();
    knoppen.replaceChildren(h("p", { style: "width:100%" }, h("b", {}, `${goed} van ${set.length} op de juiste plek. +${goed * 8} XP`)),
      h("button", { class: "knop", onclick: tijdlijn }, "Nieuwe tijdlijn"), h("button", { class: "knop wit", onclick: start }, "Naar het menu"));
  }
  $app.append(h("div", { class: "kaart" },
    h("p", { class: "zacht" }, "Tik de gebeurtenissen aan in volgorde: van oud naar nieuw."), slots, h("h3", { style: "margin-top:1em" }, "Gebeurtenissen"), kaartjes, knoppen));
  teken();
}

// =====================================================================
//  WOORDENBOEK
// =====================================================================
function woordenboek() {
  scherm("📖 AI-woordenboek");
  const lijst = h("div");
  const zoek = h("input", { class: "zoek", type: "search", placeholder: "🔍 Zoek een begrip…", oninput: (e) => teken(e.target.value) });
  function teken(q = "") {
    q = q.toLowerCase().trim();
    const res = BEGRIPPEN.slice().sort((a, b) => a[0].localeCompare(b[0], "nl")).filter(([t, d]) => !q || t.toLowerCase().includes(q) || d.toLowerCase().includes(q));
    lijst.replaceChildren(...(res.length ? res.map(([t, d]) => h("div", { class: "term" }, h("b", {}, t), h("div", {}, d))) : [h("p", { class: "zacht" }, "Niets gevonden.")]));
  }
  $app.append(h("div", { class: "kaart" }, zoek, lijst));
  teken();
}
