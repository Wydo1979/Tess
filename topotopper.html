<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topotopper – De Randstad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --creme: #FFF7E3;
  --kaart: #ffffff;
  --inkt: #1F2A44;
  --zacht: #5B6785;
  --zee: #7CC4EE;
  --zee-donker: #2E7DB5;
  --nh: #EE8A62;
  --zh: #F4DC4F;
  --ut: #AD9EE3;
  --groen: #2FA866;
  --groen-licht: #DDF6E6;
  --rood: #E5484D;
  --rood-licht: #FFE5E5;
  --geel: #FFC83D;
  --blauw: #2563EB;
  --schaduw: 0 6px 0 rgba(31, 42, 68, .12);
  --rond: 22px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Lexend", Verdana, Tahoma, sans-serif;
  font-size: 18px;
  line-height: 1.55;
  letter-spacing: .02em;
  color: var(--inkt);
  background: var(--creme);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(124, 196, 238, .28) 0 120px, transparent 121px),
    radial-gradient(circle at 92% 18%, rgba(244, 220, 79, .35) 0 90px, transparent 91px),
    radial-gradient(circle at 85% 92%, rgba(173, 158, 227, .28) 0 140px, transparent 141px);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
[hidden] { display: none !important; }

/* ---------- kop ---------- */
.kop {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  max-width: 1180px; margin: 0 auto;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 1.35rem;
  background: none; border: 0; padding: 4px;
}
.logo .kompas {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--zee-donker); color: #fff;
  display: grid; place-items: center; font-size: 1.5rem;
  box-shadow: var(--schaduw);
}
.logo small { display: block; font-weight: 400; font-size: .8rem; color: var(--zacht); line-height: 1.1; }
.kop .ruimte { flex: 1; }
.pil {
  background: #fff; border-radius: 999px; padding: 6px 14px;
  font-weight: 600; box-shadow: var(--schaduw); white-space: nowrap;
}
.rondknop {
  width: 46px; height: 46px; border-radius: 50%; border: 0;
  background: #fff; box-shadow: var(--schaduw); font-size: 1.3rem;
  display: grid; place-items: center; flex: none;
}
.rondknop:active, .knop:active, .spelkaart:active, .optie:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(31,42,68,.12); }

main { max-width: 1180px; margin: 0 auto; padding: 6px 18px 40px; }

/* ---------- start ---------- */
.held {
  background: linear-gradient(135deg, #2E7DB5, #4FA3DC);
  color: #fff; border-radius: var(--rond); padding: 22px 26px;
  box-shadow: var(--schaduw);
  display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
}
.held h1 { margin: 0 0 4px; font-size: 1.7rem; line-height: 1.2; }
.held p { margin: 0; opacity: .95; }
.rang { font-weight: 800; font-size: 1.05rem; margin-top: 12px; }
.balk { height: 16px; border-radius: 99px; background: rgba(255,255,255,.3); overflow: hidden; margin-top: 6px; }
.balk > i { display: block; height: 100%; background: var(--geel); border-radius: 99px; transition: width .6s; }
.held .groot { font-size: 4.2rem; line-height: 1; }

h2 { font-size: 1.15rem; margin: 26px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  border: 3px solid transparent; background: #fff; border-radius: 999px;
  padding: 8px 18px; font-weight: 600; box-shadow: var(--schaduw);
  display: inline-flex; align-items: center; gap: 8px;
}
.chip .bol { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(0,0,0,.2); }
.chip[aria-pressed="true"] { border-color: var(--inkt); background: #FFF1B8; }

.spellen { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.spelkaart {
  text-align: left; border: 0; background: #fff; border-radius: var(--rond);
  padding: 18px 20px; box-shadow: var(--schaduw);
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center;
  border-bottom: 8px solid var(--tint, var(--zee));
}
.spelkaart .emoji { font-size: 2.6rem; grid-row: span 2; }
.spelkaart b { font-size: 1.15rem; }
.spelkaart span { color: var(--zacht); font-size: .92rem; line-height: 1.35; }
.spelkaart.toets { background: #1F2A44; color: #fff; --tint: var(--geel); }
.spelkaart.toets span { color: #C9D2EA; }

.album { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.album section { background: #fff; border-radius: var(--rond); padding: 14px 16px; box-shadow: var(--schaduw); border-top: 10px solid var(--tint); }
.album h3 { margin: 0 0 8px; font-size: 1.05rem; }
.album ul { list-style: none; margin: 0; padding: 0; }
.album li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.album li button { border: 0; background: none; padding: 0; text-align: left; }
.album li button:hover { text-decoration: underline; }
.sterren { letter-spacing: 1px; color: #C9CEDA; white-space: nowrap; }
.sterren b { color: #F5A800; font-weight: 400; }
.plus { color: var(--zacht); font-size: .8em; }

/* ---------- spel ---------- */
.speelveld { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 18px; align-items: start; }
.kaartdoos {
  background: var(--zee); border-radius: var(--rond); box-shadow: var(--schaduw);
  overflow: hidden; border: 5px solid #fff; position: sticky; top: 8px;
}
#kaart { display: block; width: 100%; height: auto; max-height: calc(100vh - 100px); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.paneel { background: #fff; border-radius: var(--rond); box-shadow: var(--schaduw); padding: 18px 20px 20px; }
.voortgang { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: .9rem; color: var(--zacht); font-weight: 600; }
.voortgang .balk { flex: 1; background: #E8ECF4; margin: 0; height: 12px; }
.voortgang .balk > i { background: var(--groen); }
.vraagregel { display: flex; gap: 12px; align-items: flex-start; }
.vraag { font-size: 1.45rem; font-weight: 600; line-height: 1.3; margin: 0; flex: 1; }
.vraag b { font-weight: 800; color: var(--zee-donker); }
.uitleg { color: var(--zacht); margin: 8px 0 0; }
.luister {
  flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0;
  background: var(--geel); font-size: 1.5rem; box-shadow: var(--schaduw);
}
.luister.klein { width: 40px; height: 40px; font-size: 1.1rem; }
.opties { display: grid; gap: 10px; margin-top: 16px; }
.optie {
  border: 3px solid #D8DEEA; background: #fff; border-radius: 16px;
  padding: 12px 16px; font-weight: 600; font-size: 1.1rem; text-align: left;
  box-shadow: var(--schaduw); display: flex; align-items: center; gap: 10px;
}
.optie:hover:not(:disabled) { border-color: var(--zee-donker); }
.optie.goed { background: var(--groen-licht); border-color: var(--groen); }
.optie.fout { background: var(--rood-licht); border-color: var(--rood); opacity: .75; }
.optie:disabled { cursor: default; }
.optie .bol { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(0,0,0,.2); flex: none; }
.schrijf { margin-top: 16px; }
.schrijf input {
  width: 100%; font: inherit; font-size: 1.4rem; font-weight: 600; letter-spacing: .06em;
  padding: 12px 16px; border-radius: 16px; border: 3px solid #D8DEEA; color: var(--inkt); background: #FFFDF5;
}
.schrijf input:focus { outline: none; border-color: var(--zee-donker); }
.hintletters { font-size: 1.4rem; font-weight: 800; letter-spacing: .22em; margin: 10px 0 0; color: var(--zee-donker); min-height: 1.5em; word-break: break-word; }
.rij { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.knop {
  border: 0; border-radius: 16px; padding: 12px 22px; font-weight: 800; font-size: 1.05rem;
  background: var(--groen); color: #fff; box-shadow: var(--schaduw);
}
.knop.twee { background: #EEF2FA; color: var(--inkt); font-weight: 600; }
.knop.groot { font-size: 1.2rem; padding: 14px 28px; }
.terug { border: 0; background: none; color: var(--zacht); font-weight: 600; padding: 6px 0; margin-bottom: 6px; }
.melding { border-radius: 16px; padding: 14px 16px; margin-top: 16px; animation: plop .25s; }
.melding h3 { margin: 0 0 4px; font-size: 1.2rem; }
.melding p { margin: 4px 0 0; }
.melding.goed { background: var(--groen-licht); border: 3px solid var(--groen); }
.melding.fout { background: var(--rood-licht); border: 3px solid var(--rood); }
.melding.tip { background: #FFF4CC; border: 3px solid var(--geel); }
.melding .weetje { display: flex; gap: 10px; align-items: flex-start; }
.melding .weetje p { flex: 1; margin: 0; }
.spelling { font-size: 1.35rem; font-weight: 800; letter-spacing: .08em; }
.spelling s { color: var(--rood); }
@keyframes plop { from { transform: scale(.94); opacity: 0; } }

.ontdek h3 { font-size: 1.6rem; margin: 0; line-height: 1.2; }
.ontdek .soort { display: inline-block; border-radius: 99px; padding: 2px 12px; font-size: .85rem; font-weight: 600; margin: 6px 0 10px; }
.ontdek dl { margin: 0; }
.ontdek dt { font-weight: 800; margin-top: 10px; font-size: .9rem; color: var(--zacht); }
.ontdek dd { margin: 0; }

/* ---------- kaart ---------- */
.land { fill: #DDE2E8; stroke: #fff; stroke-width: 1.2; }
.prov { stroke: #fff; stroke-width: 2.5; stroke-linejoin: round; transition: fill .3s; }
.prov.NH { fill: var(--nh); } .prov.ZH { fill: var(--zh); } .prov.UT { fill: var(--ut); }
#kaart.grijs .prov { fill: #F1E3C4; stroke: #F1E3C4; }
.prov.doel { stroke: var(--inkt); stroke-width: 5; animation: knipper 1s infinite alternate; }
.randstad { fill: none; stroke: #1F2A44; stroke-opacity: .16; stroke-width: 38; stroke-linecap: round; stroke-linejoin: round; }
.randstadlijn { fill: none; stroke: #1F2A44; stroke-opacity: .5; stroke-width: 38; stroke-linecap: round; stroke-linejoin: round; }
.groenehart { fill: #3DBB6E; fill-opacity: .5; stroke: #1E8A4B; stroke-width: 2.5; stroke-dasharray: 7 5; }
.randstad.doel { stroke-opacity: .55; stroke: var(--blauw); animation: knipper 1s infinite alternate; }
.groenehart.doel { fill-opacity: .95; stroke-width: 5; animation: knipper 1s infinite alternate; }
#kaart.grijs .gebieden { display: none; }
#kaart[data-doel="prov"] .gebieden { pointer-events: none; }
.stippen { pointer-events: none; }
.stip circle { fill: #fff; stroke: var(--inkt); stroke-width: 3; transition: r .15s; }
.stip text { font-size: 19px; text-anchor: middle; dominant-baseline: central; }
.stip.goed circle { fill: var(--groen); stroke: #0E5A30; }
.stip.fout circle { fill: var(--rood); stroke: #7A1418; }
.stip.doel circle { fill: var(--geel); stroke-width: 4; }
.stip.dim { opacity: .35; }
.puls { fill: none; stroke: var(--inkt); stroke-width: 4; pointer-events: none; animation: puls 1.2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes puls { from { transform: scale(.5); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
@keyframes knipper { from { opacity: 1; } to { opacity: .55; } }
.labels { pointer-events: none; }
.labels text { font-size: 17px; font-weight: 800; fill: var(--inkt); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
.labels text.fout { fill: #B4232A; }
.labels text.goed { fill: #0E6B38; }
.water { font-size: 15px; font-style: italic; fill: #fff; opacity: .9; pointer-events: none; letter-spacing: .12em; }
.windroos { pointer-events: none; }

/* ---------- einde ---------- */
.einde { text-align: center; background: #fff; border-radius: var(--rond); padding: 30px 22px; box-shadow: var(--schaduw); max-width: 640px; margin: 20px auto; }
.einde > .groot { font-size: 4.5rem; line-height: 1; }
.einde h2 { font-size: 1.7rem; margin: 10px 0 6px; }
.cijfer { width: 150px; height: 150px; border-radius: 50%; margin: 14px auto; display: grid; place-items: center; font-size: 3.4rem; font-weight: 800; background: var(--geel); border: 8px solid #fff; box-shadow: 0 0 0 5px var(--inkt); }
.einde .sterren { font-size: 2.6rem; }
.einde .rij { justify-content: center; }
.einde .chips { justify-content: center; margin-top: 10px; }

/* ---------- instellingen ---------- */
dialog { border: 0; border-radius: var(--rond); padding: 24px; max-width: 440px; width: calc(100% - 32px); color: var(--inkt); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(31,42,68,.5); }
dialog h2 { margin-top: 0; font-size: 1.4rem; }
.schakel { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px solid #EEF2FA; }
.schakel input { width: 26px; height: 26px; accent-color: var(--groen); flex: none; }
.schakel small { display: block; color: var(--zacht); line-height: 1.3; }

.confetti { position: fixed; top: -30px; font-size: 1.6rem; pointer-events: none; z-index: 50; animation: val linear forwards; }
@keyframes val { to { transform: translateY(110vh) rotate(720deg); } }

@media (max-width: 860px) {
  body { font-size: 17px; }
  .speelveld { grid-template-columns: 1fr; }
  .kaartdoos { position: static; }
  #kaart { max-height: 56vh; }
  .held { grid-template-columns: 1fr; }
  .held .groot { display: none; }
  .logo small { display: none; }
  .vraag { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="kop">
  <button class="logo" id="naarStart" aria-label="Naar het begin">
    <span class="kompas">🧭</span>
    <span>Topotopper<small>De Randstad</small></span>
  </button>
  <span class="ruimte"></span>
  <span class="pil" id="sterTeller" title="Jouw sterren">⭐ 0</span>
  <button class="rondknop" id="instelKnop" aria-label="Instellingen">⚙️</button>
</header>

<main>
  <!-- START -->
  <div id="schermStart">
    <section class="held">
      <div>
        <h1>Hoi topotopper! 👋</h1>
        <p>Leer alle plaatsen van de Randstad. Speel elke dag een paar spelletjes, dan haal jij een 10!</p>
        <div class="rang" id="rang"></div>
        <div class="balk"><i id="rangBalk" style="width:0"></i></div>
      </div>
      <div class="groot" aria-hidden="true">🗺️</div>
    </section>

    <h2>1. Wat wil je oefenen?</h2>
    <div class="chips" id="filterChips"></div>

    <h2>2. Kies een spel</h2>
    <div class="spellen" id="spellen"></div>

    <h2>Mijn topo <span class="plus">– 3 sterren = je kent het helemaal! Tik op een naam om hem te horen.</span></h2>
    <div class="album" id="album"></div>
  </div>

  <!-- SPEL -->
  <div id="schermSpel" hidden>
    <button class="terug" id="stopKnop">← Stoppen</button>
    <div class="speelveld">
      <div class="kaartdoos"><svg id="kaart" role="img" aria-label="Kaart van de Randstad"></svg></div>
      <div class="paneel" id="paneel" aria-live="polite"></div>
    </div>
  </div>

  <!-- EINDE -->
  <div id="schermEinde" hidden></div>
</main>

<dialog id="instellingen">
  <h2>⚙️ Instellingen</h2>
  <label class="schakel"><input type="checkbox" id="insVoorlezen"><span>🔊 Automatisch voorlezen<small>Elke vraag wordt vanzelf voorgelezen.</small></span></label>
  <label class="schakel"><input type="checkbox" id="insGeluid"><span>🎵 Geluidjes<small>Een vrolijk geluidje bij goed of fout.</small></span></label>
  <label class="schakel"><input type="checkbox" id="insPlus"><span>➕ Extra topo erbij<small>De namen met een + in je boek: Zandvoort, Groene Hart, Vlaardingen, Nieuwegein en Woerden.</small></span></label>
  <label class="schakel"><input type="checkbox" id="insProv"><span>🗺️ Provincies ook oefenen<small>Noord-Holland, Zuid-Holland en Utrecht aanwijzen en schrijven.</small></span></label>
  <div class="rij">
    <button class="knop" id="insKlaar">Klaar</button>
    <button class="knop twee" id="insWis">Alles wissen</button>
  </div>
</dialog>

const kanPraten = "speechSynthesis" in window;
let stem = null;
function zoekStem() {
  const st = speechSynthesis.getVoices();
  stem = st.find(v => v.lang === "nl-NL") || st.find(v => v.lang && v.lang.toLowerCase().startsWith("nl")) || null;
}

function lees(tekst) {
  if (!kanPraten) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(tekst.replace(/\s+/g, " "));
  u.lang = "nl-NL"; if (stem) u.voice = stem;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

let audio = null;
function toon(freqs, duur = .13, type = "sine") {
  if (!S.geluid) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * duur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + duur);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + duur + .02);
    });
  } catch (e) {}
}
const geluidGoed = () => toon([523, 659, 784]);
const geluidFout = () => toon([220, 175], .18, "triangle");
const geluidFeest = () => toon([523, 659, 784, 1047, 784, 1047], .12);

}

function vormVan(it) {

function label(it, klasse = "", tekst) {
  const t = tekst || it.kort || it.naam;
  let x = it.x, y = it.y + 6, anker = "middle";
  const d = it.icoon ? 17 : 13;
  if (it.r === "r") { x += d; anker = "start"; }
  else if (it.r === "l") { x -= d; anker = "end"; }
  else if (it.r === "t") y -= d + 8;
  else if (it.r === "b") y += d + 10;
  // binnen beeld houden
  const breed = t.length * 10.5;
  if (anker === "start" && x + breed > KW - 6) { anker = "end"; x = it.x - d; }
  if (anker === "end" && x - breed < 6) { anker = "start"; x = it.x + d; }
  svg.querySelector(".labels").insertAdjacentHTML("beforeend", `<text class="${klasse}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anker}">${esc(t)}</text>`);
}
function kaartPunt(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function dichtsteStip(p, lijst, max = 30) {
  let beste = null, afstand = max;
  lijst.forEach(it => { if (it.vorm !== "stip") return; const d = Math.hypot(it.x - p.x, it.y - p.y); if (d < afstand) { afstand = d; beste = it; } });
  return beste;
}
/* Geeft terug wat er op de kaart is aangetikt: { it } of { land: true } of null (zee). */
function watIsGetikt(e, lijst, doelVorm) {
  const p = kaartPunt(e), t = e.target;
  if (doelVorm === "prov") {
    const el = t.closest("[data-prov]");
    return el ? { it: item(el.dataset.prov) } : null;
  }
  if (doelVorm === "vlak") {
    const el = t.closest("[data-gebied]");
    if (el) return { it: item(el.dataset.gebied) };
    return t.closest("[data-prov]") ? { land: true } : null;
  }
  const stip = dichtsteStip(p, lijst);
  if (stip) return { it: stip };
  const el = t.closest("[data-id]");
  if (el && lijst.some(it => it.id === el.dataset.id)) return { it: item(el.dataset.id) };
  if (doelVorm === "alles") {
    const g = t.closest("[data-gebied]");
    if (g && lijst.some(it => it.id === g.dataset.gebied)) return { it: item(g.dataset.gebied) };
    const pr = t.closest("[data-prov]");
    if (pr) return { it: item(pr.dataset.prov) };
  }
  return t.closest("[data-prov]") ? { land: true } : null;
}

function startOntdek() {
  R = { spel: "ontdek", lijst: actief() };
  scherm("Spel"); kaartSchoon(); tekenStippen(R.lijst);
  $("#paneel").innerHTML = `
    <div class="vraagregel"><p class="vraag">🔭 Ontdek de kaart</p><button class="luister" data-lees="Tik op een stip op de kaart. Dan hoor je hoe de plaats heet." aria-label="Lees voor">🔊</button></div>
    <p class="uitleg">Tik op een stip, een gebied of een provincie. Dan zie en hoor je hoe het heet.</p>
    <div class="rij"><button class="knop twee" id="alleNamen" aria-pressed="false">🏷️ Laat alle namen zien</button></div>
    <div id="ontdekInfo"></div>`;
  leesAuto("Tik op een stip op de kaart. Dan hoor je hoe de plaats heet.");
}
function toonOntdek(it) {
  const alle = $("#alleNamen").getAttribute("aria-pressed") === "true";
  svg.querySelectorAll(".doel").forEach(el => el.classList.remove("doel"));
  if (!alle) svg.querySelector(".labels").innerHTML = "";
  markeer(it, "doel"); puls(it);
  if (!alle) label(it);
  const p = PROV[it.prov];
  $("#ontdekInfo").innerHTML = `
    <div class="melding tip ontdek">
      <div class="vraagregel"><h3>${it.icoon || ""} ${esc(it.naam)}</h3><button class="luister" data-lees="${esc(zeg(it))}" aria-label="Lees de naam voor">🔊</button></div>
      <span class="soort" style="background:${p.kleur}">${it.soort}${it.vorm === "prov" || it.vorm === "vlak" ? "" : " in " + p.naam}</span>
      <dl>
        <dt>📍 Waar ligt het?</dt><dd>${esc(it.waar)}</dd>
        <dt>💡 Weetje</dt><dd class="weetje"><p>${esc(it.weetje)}</p><button class="luister klein" data-lees="${esc(zeg(it) + ". " + it.waar + " " + it.weetje)}" aria-label="Lees alles voor">🔊</button></dd>
        <dt>✏️ Zo schrijf je het</dt><dd>${esc(it.spel)}</dd>
      </dl>
    </div>`;
  leesAuto(zeg(it));
}

/* ---------- rondes ---------- */
let R = null;
const VAK = { wijs: "w", naam: "n", schrijf: "s" };
function startRonde(spel) {
  let lijst = actief();
  if (spel === "prov") lijst = lijst.filter(it => it.vorm === "stip");
  if (lijst.length < 2) return;
  let rij;
  if (spel === "toets") {
    rij = schud(lijst).map((it, i) => ({ it, type: i % 2 ? "schrijf" : "wijs" }));
  } else {
    const vak = VAK[spel];
    // wat je nog niet goed kent, komt vaker
    rij = lijst.map(it => ({ it, w: Math.pow(Math.random(), 1 / (4 - (vak ? ken(it.id)[vak] : 0))) }))
      .sort((a, b) => b.w - a.w).slice(0, 10).map(o => ({ it: o.it, type: spel }));
    rij = schud(rij);
  }
  R = { spel, lijst, rij, i: 0, goed: 0, totaal: rij.length, fouten: [], herhaald: new Set() };
  scherm("Spel"); tekenStippen(lijst);
  vraag();
}
function vraag() {
  const v = R.rij[R.i], it = v.it;
  R.kans = 1; R.klaar = false; R.hints = 0; R.gespiekt = false;
  kaartSchoon();
  const kop = `<div class="voortgang"><span>${R.spel === "toets" ? "🏆 Toets · " : ""}Vraag ${Math.min(R.i + 1, R.totaal)} van ${R.totaal}</span><div class="balk"><i style="width:${Math.round(Math.min(R.i, R.totaal) / R.totaal * 100)}%"></i></div><span>⭐ ${R.goed}</span></div>`;
  let tekst, html, voorlees;
  if (v.type === "wijs") {
    svg.dataset.doel = it.vorm;
    voorlees = `Waar ligt ${it.lidnaam || (it.lid || "") + zeg(it)}?`;
    tekst = `Waar ligt <b>${esc(metLid(it))}</b>?`;
    html = `<p class="uitleg">👆 Tik op ${it.vorm === "stip" ? "de goede stip" : it.vorm === "prov" ? "de goede provincie" : "het goede gebied"} op de kaart.</p>`;
  } else if (v.type === "naam") {
    toonDoel(it);
    voorlees = SOORTVRAAG[it.soort];
    tekst = voorlees;
    html = `<div class="opties">${keuzes(it).map(o => `<button class="optie" data-keuze="${o.id}">${esc(o.naam)}<span class="ruimte" style="flex:1"></span><span class="luister klein" role="button" data-lees="${esc(zeg(o))}" aria-label="Lees voor">🔊</span></button>`).join("")}</div>`;
  } else if (v.type === "schrijf") {
    toonDoel(it);
    voorlees = SOORTVRAAG[it.soort] + " Schrijf de naam op.";
    tekst = SOORTVRAAG[it.soort] + " Schrijf de naam.";
    html = `<form class="schrijf" id="schrijfForm" autocomplete="off">
        <input id="schrijfIn" type="text" inputmode="text" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="Typ de naam" placeholder="Typ hier…">
        <p class="hintletters" id="hintLetters"></p>
        <div class="rij"><button class="knop" type="submit">Controleer</button>
        ${R.spel === "toets" ? "" : `<button class="knop twee" type="button" id="hintKnop">💡 Hint</button><button class="knop twee" type="button" id="spiekKnop">👀 Spiek</button>`}</div>
      </form>`;
  } else {
    svg.classList.add("grijs");
    markeer(it, "doel"); puls(it); label(it);
    voorlees = `In welke provincie ligt ${zeg(it)}?`;
    tekst = `In welke provincie ligt <b>${esc(it.kort || it.naam)}</b>?`;
    html = `<div class="opties">${Object.entries(PROV).map(([k, p]) => `<button class="optie" data-keuze="${k}"><i class="bol" style="background:${p.kleur}"></i>${p.naam}</button>`).join("")}</div>`;
  }
  R.voorlees = voorlees;
  $("#paneel").innerHTML = `${kop}<div class="vraagregel"><p class="vraag">${tekst}</p><button class="luister" data-lees="${esc(voorlees)}" aria-label="Lees de vraag voor">🔊</button></div>${html}<div id="melding"></div>`;
  if (v.type === "schrijf") {
    const inp = $("#schrijfIn");
    if (matchMedia("(pointer: fine)").matches) inp.focus();
  }
  leesAuto(voorlees);
}
function toonDoel(it) {
  svg.querySelectorAll(".stip").forEach(el => el.classList.add("dim"));
  const el = vormVan(it); if (el) el.classList.remove("dim");
  markeer(it, "doel"); puls(it);
}
function keuzes(it) {
  const rest = R.lijst.filter(o => o.id !== it.id);
  const zelfde = rest.filter(o => (o.vorm === "stip") === (it.vorm === "stip"));
  const bron = zelfde.length >= 3 ? zelfde : rest;
  const dichtbij = [...bron].sort((a, b) => Math.hypot(a.x - it.x, a.y - it.y) - Math.hypot(b.x - it.x, b.y - it.y));
  const gekozen = dichtbij.slice(0, 2);
  const over = schud(bron.filter(o => !gekozen.includes(o)));
  if (over.length) gekozen.push(over[0]);
  return schud([it, ...gekozen]);
}
const norm = t => t.toLowerCase().replace(/[’'`]/g, "'").replace(/\s+/g, " ").trim();
function verschil(a, b) { // Levenshtein
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function goedeNaam(it) { return it.kort || it.naam; }

/* Eén poging. goed = true/false. tip = tekst bij de eerste fout. */
function poging(goed, tip, extra) {
  if (R.klaar) return;
  const v = R.rij[R.i], it = v.it;
  if (goed) return afronden(true, extra);
  geluidFout();
  if (R.spel === "toets" || R.kans === 2) return afronden(false, extra);
  R.kans = 2;
  $("#melding").innerHTML = `<div class="melding tip"><h3>🤔 Bijna! Probeer het nog een keer.</h3><div class="weetje"><p><b>Tip:</b> ${esc(tip)}</p><button class="luister klein" data-lees="${esc("Tip. " + tip)}" aria-label="Lees de tip voor">🔊</button></div></div>`;
  leesAuto("Bijna! Probeer het nog een keer. Tip: " + tip);
}
function afronden(goed, extra = "") {
  const v = R.rij[R.i], it = v.it;
  R.klaar = true;
  const inEenKeer = goed && R.kans === 1 && !R.gespiekt && !R.hints;
  const vak = VAK[v.type];
  if (inEenKeer) { R.goed++; tel(it.id, vak, true); }
  else if (!goed) {
    tel(it.id, vak, false);
    if (!R.fouten.includes(it)) R.fouten.push(it);
    if (R.spel !== "toets" && !R.herhaald.has(it.id)) { R.herhaald.add(it.id); R.rij.push({ it, type: v.type }); }
  }
  // kaart: laat het goede antwoord zien
  svg.classList.remove("grijs"); svg.removeAttribute("data-doel");
  svg.querySelectorAll(".dim").forEach(el => el.classList.remove("dim"));
  svg.querySelector(".extra").innerHTML = "";
  svg.querySelectorAll(".doel").forEach(el => el.classList.remove("doel"));
  markeer(it, goed ? "goed" : "doel"); if (!goed) puls(it);
  if (![...svg.querySelectorAll(".labels text")].some(t => t.textContent === (it.kort || it.naam))) label(it, goed ? "goed" : "");
  document.querySelectorAll("#paneel .optie, #paneel form button, #paneel form input").forEach(el => { el.disabled = true; });
  const laatste = R.i >= R.rij.length - 1;
  const knop = `<div class="rij"><button class="knop groot" id="verder">${laatste ? "Klaar! 🎉" : "Verder →"}</button></div>`;
  const weet = `<div class="weetje"><p>💡 ${esc(it.weetje)}</p><button class="luister klein" data-lees="${esc(it.weetje)}" aria-label="Lees het weetje voor">🔊</button></div>`;
  if (goed) {
    const zin = kies(GOED);
    geluidGoed();
    $("#melding").innerHTML = `<div class="melding goed"><h3>✅ ${inEenKeer ? zin + " ⭐" : "Goed! Nu weet je het."}</h3>${extra}${weet}${knop}</div>`;
    leesAuto(inEenKeer ? zin : "Goed! Nu weet je het.");
  } else {
    const uit = v.type === "prov" ? `${goedeNaam(it)} ligt in ${PROV[it.prov].naam}.`
      : v.type === "wijs" ? `Kijk op de kaart: daar ligt ${metLid(it)}.` : `Het goede antwoord is ${goedeNaam(it)}.`;
    const tip = v.type === "schrijf" ? it.spel : it.waar;
    $("#melding").innerHTML = `<div class="melding fout"><h3>❌ Jammer!</h3><p><b>${esc(uit)}</b></p>${extra}<div class="weetje"><p>📌 ${esc(tip)}</p><button class="luister klein" data-lees="${esc(uit.replace(it.kort || it.naam, zeg(it)) + " " + tip)}" aria-label="Lees voor">🔊</button></div>${knop}</div>`;
    leesAuto(v.type === "prov" ? `${zeg(it)} ligt in ${PROV[it.prov].naam}.` : v.type === "wijs" ? `Kijk op de kaart. Daar ligt ${it.lidnaam || (it.lid || "") + zeg(it)}.` : `Het goede antwoord is ${zeg(it)}.`);
  }
  const k = $("#verder"); if (k && matchMedia("(pointer: fine)").matches) k.focus();
  $("#melding").scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function verder() {
  if (!R || !R.klaar) return;
  R.i++;
  if (R.i >= R.rij.length) return einde();
  vraag();
}

function kaartKlik(e) {
  if (!R) return;
  if (R.spel === "ontdek") {
    const g = watIsGetikt(e, R.lijst, "alles");
    if (g && g.it && R.lijst.includes(g.it)) toonOntdek(g.it);
    return;
  }
  const v = R.rij[R.i];
  if (!v || v.type !== "wijs" || R.klaar) return;
  const it = v.it, g = watIsGetikt(e, R.lijst, it.vorm);
  if (!g) return;
  if (!g.it && it.vorm === "stip") { $("#melding").innerHTML = `<div class="melding tip"><p>👆 Tik precies op een stip.</p></div>`; return; }
  if (g.it === it) return poging(true);
  // fout: laat zien wat het wél was
  if (g.it) {
    markeer(g.it, "fout");
    label(g.it, "fout");
    const gek = g.it;
    setTimeout(() => { if (gek.vorm === "prov") svg.querySelectorAll(`[data-prov="${gek.id}"]`).forEach(el => el.classList.remove("fout")); }, 900);
  }
  const dat = g.it ? `Dat is ${metLid(g.it)}. ` : "";
  poging(false, dat + it.waar, g.it ? `<p>Jij tikte op ${esc(metLid(g.it))}.</p>` : "");
}
function controleerSchrijf() {
  const v = R.rij[R.i], it = v.it, inp = $("#schrijfIn"), getypt = inp.value.replace(/\s+/g, " ").trim();
  if (!getypt) { inp.focus(); return; }
  const goed = [it.naam, it.kort].filter(Boolean);
  if (it.lid) goed.push(it.lid + it.naam);
  const juist = goed.some(g => norm(g) === norm(getypt));
  const mooi = goedeNaam(it);
  if (juist) {
    const hoofd = goed.includes(getypt) || getypt === (it.lid || "") + it.naam;
    return poging(true, "", hoofd ? "" : `<p>🔠 Let wel op de hoofdletters: <b>${esc(mooi)}</b></p>`);
  }
  const dichtbij = verschil(norm(mooi), norm(getypt)) <= 2;
  const extra = `<p>Jij schreef: <span class="spelling"><s>${esc(getypt)}</s></span><br>Goed is: <span class="spelling">${esc(mooi)}</span></p>`;
  if (R.spel !== "toets" && R.kans === 1) { inp.select(); }
  poging(false, (dichtbij ? "Je bent er bijna! Kijk goed naar elke letter. " : "") + it.spel, extra);
}
function hint() {
  const it = R.rij[R.i].it, naam = goedeNaam(it);
  R.hints = Math.min(naam.length, R.hints + 1 + (naam[R.hints] === " " ? 1 : 0));
  $("#hintLetters").textContent = [...naam].map((c, i) => i < R.hints || c === " " || c === "-" ? (c === " " ? "  " : c) : "_").join("");
}
function spiek() {
  const it = R.rij[R.i].it;
  R.gespiekt = true;
  svg.querySelector(".labels").innerHTML = ""; label(it);
  lees(zeg(it));
  setTimeout(() => { if (R && !R.klaar && R.rij[R.i] && R.rij[R.i].it === it) svg.querySelector(".labels").innerHTML = ""; }, 3000);
}

/* ---------- einde ---------- */
function einde() {
  const goed = R.goed, totaal = R.totaal, deel = goed / totaal, spel = R.spel, fouten = R.fouten;
  kaartSchoon();
  let kop, groot, midden, zin;
  if (spel === "toets") {
    const cijfer = Math.round((1 + 9 * deel) * 10) / 10;
    if (!S.besteCijfer || cijfer > S.besteCijfer) { S.besteCijfer = cijfer; bewaar(); }
    const c = String(cijfer).replace(".", ",");
    groot = cijfer >= 10 ? "👑" : cijfer >= 8 ? "🏆" : cijfer >= 5.5 ? "💪" : "🌱";
    kop = cijfer >= 10 ? "Een 10! Jij bent een echte topotopper!" : cijfer >= 9 ? "Bijna een 10! Wat knap!" : cijfer >= 8 ? "Wat een mooi cijfer!" : cijfer >= 5.5 ? "Voldoende! Nog even oefenen voor de 10." : "Goed geprobeerd! Oefenen maakt je beter.";
    midden = `<div class="cijfer">${c}</div><p>${goed} van de ${totaal} goed.</p>`;
    zin = `${kop} Je cijfer is een ${c}.`;
  } else {
    const st = deel >= .9 ? 3 : deel >= .6 ? 2 : deel >= .3 ? 1 : 0;
    groot = ["🌱", "👍", "🎉", "🏆"][st];
    kop = ["Goed geprobeerd!", "Lekker bezig!", "Heel knap gedaan!", "Wauw, wat ben jij goed!"][st];
    midden = `<div>${sterTekst(st)}</div><p>${goed} van de ${totaal} in één keer goed.</p>`;
    zin = `${kop} Je had er ${goed} van de ${totaal} in één keer goed.`;
  }
  $("#schermEinde").innerHTML = `<div class="einde">
      <div class="groot">${groot}</div><h2>${kop}</h2>${midden}
      ${fouten.length ? `<h3>Deze kun je nog even oefenen:</h3><div class="chips">${fouten.map(it => `<button class="chip" data-zeg="${it.id}">🔊 ${esc(it.naam)}</button>`).join("")}</div>`
        : `<p>Je had geen enkele fout. 🌟</p>`}
      <div class="rij" style="margin-top:22px"><button class="knop groot" data-spel="${spel}">Nog een keer</button><button class="knop twee groot" id="naarHuis">Ander spel</button></div>
    </div>`;
  scherm("Einde");
  $("#sterTeller").textContent = `⭐ ${totaalSterren()}`;
  if (deel >= .6) { confetti(deel >= .9 ? 90 : 40); geluidFeest(); }
  leesAuto(zin);
  R = null;
}

/* ---------- knoppen ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const l = t.closest("[data-lees]");
  if (l) { lees(l.dataset.lees); e.stopPropagation(); return; }
  const z = t.closest("[data-zeg]");
  if (z) { lees(zeg(item(z.dataset.zeg))); return; }
  const f = t.closest("[data-filter]");
  if (f) { S.filter = f.dataset.filter; bewaar(); tekenStart(); return; }
  const sp = t.closest("[data-spel]");
  if (sp) { sp.dataset.spel === "ontdek" ? startOntdek() : startRonde(sp.dataset.spel); return; }
  const k = t.closest("[data-keuze]");
  if (k && R && !R.klaar && !k.disabled) {
    const v = R.rij[R.i], it = v.it;
    const goed = v.type === "prov" ? k.dataset.keuze === it.prov : k.dataset.keuze === it.id;
    k.classList.add(goed ? "goed" : "fout"); if (!goed) k.disabled = true;
    if (!goed && (R.spel === "toets" || R.kans === 2)) {
      const juist = document.querySelector(`[data-keuze="${v.type === "prov" ? it.prov : it.id}"]`); if (juist) juist.classList.add("goed");
    }
    poging(goed, v.type === "prov" ? `Kijk waar de stip ligt. ${it.waar}` : it.waar);
    return;
  }
  if (t.closest("#verder")) return verder();
  if (t.closest("#hintKnop")) return hint();
  if (t.closest("#spiekKnop")) return spiek();
  if (t.closest("#alleNamen")) {
    const b = t.closest("#alleNamen"), aan = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", aan); b.textContent = aan ? "🙈 Verstop de namen" : "🏷️ Laat alle namen zien";
    svg.querySelector(".labels").innerHTML = "";
    if (aan) R.lijst.forEach(it => label(it));
    return;
  }
  if (t.closest("#stopKnop") || t.closest("#naarHuis") || t.closest("#naarStart")) return tekenStart();
});
document.addEventListener("submit", e => { if (e.target.id === "schrijfForm") { e.preventDefault(); if (R && !R.klaar) controleerSchrijf(); } });
svg.addEventListener("click", kaartKlik);

const dlg = $("#instellingen");
$("#instelKnop").addEventListener("click", () => {
  $("#insVoorlezen").checked = S.voorlezen; $("#insGeluid").checked = S.geluid; $("#insPlus").checked = S.plus; $("#insProv").checked = S.provincies;
  dlg.showModal();
});
function sluitInstellingen() {
  S.voorlezen = $("#insVoorlezen").checked; S.geluid = $("#insGeluid").checked; S.plus = $("#insPlus").checked; S.provincies = $("#insProv").checked;
  bewaar(); if (!S.voorlezen) stil();
  if (!$("#schermSpel").hidden || !$("#schermStart").hidden) tekenStart();
}
$("#insKlaar").addEventListener("click", () => dlg.close());
dlg.addEventListener("close", sluitInstellingen);
let wisTeller = 0;
$("#insWis").addEventListener("click", e => {
  if (++wisTeller < 2) { e.target.textContent = "Zeker weten? Tik nog een keer"; return; }
  wisTeller = 0; e.target.textContent = "Alles wissen";
  S.kennis = {}; S.besteCijfer = null; bewaar(); dlg.close();
});

tekenKaart();
tekenStart();
</script>
</body>
