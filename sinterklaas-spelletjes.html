<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9dbe0; font-family: "Segoe UI", Verdana, Arial, sans-serif; }
  .balk { max-width: 210mm; margin: 6mm auto 0; background: #f3f6ff; border: 1px solid #c9d3f5; border-radius: 3mm; padding: 3mm 4mm; display: flex; gap: 4mm; align-items: end; flex-wrap: wrap; font-size: 11pt; }

  svg.vel { display: block; width: 190mm; height: 277mm; }
  svg text { font-family: "Arial Black", "Segoe UI Black", Arial, sans-serif; }
  .kop { font-size: 6px; fill: #222; }
  .sub { font-family: Verdana, Arial, sans-serif !important; font-size: 3.1px; fill: #555; }
  .lbl { font-family: Verdana, Arial, sans-serif !important; font-size: 2.6px; fill: #666; }
  .lijn { fill: none; stroke: #555; stroke-width: .3; stroke-dasharray: 2 1; }
  .vouw { fill: none; stroke: #888; stroke-width: .3; stroke-dasharray: 4 1 1 1; }
  @page { size: A4 portrait; margin: 0; }
  @media print { body { background: none; } .page { margin: 0; box-shadow: none; break-after: page; } .no-print { display: none !important; } }
</style>

" fill="#fff3a0"/></g><g transform="rotate(15 80.5 62.0)"><rect x="76" y="58" width="9" height="8" rx="1" fill="#2fbf71"/><rect x="79.8" y="58" width="1.4" height="8" fill="#fff"/><rect x="76" y="60.8" width="9" height="1.3" fill="#fff"/><path d="M80.5,58 q-2.7,-2.8 -2.9,0 q1.4,0.8 2.9,0 q2.7,-2.8 2.9,0 q-1.4,0.8 -2.9,0Z" fill="#fff"/></g></svg><rect x="3" y="37" width="38" height="1.4" fill="#7b5cff"/><text x="22" y="42.4" font-size="3.1" fill="#222" text-anchor="middle">Sint in</text><text x="22" y="46.4" font-size="3.1" fill="#222" text-anchor="middle">de Ruimte</text></g><g transform="translate(0,212)"><text x="0" y="0" class="kop" style="font-size:4.6px">Zo maak je ze</text><text x="0" y="8" class="sub">1. Print op A4 met schaal 100% (werkelijke grootte), het liefst op stevig papier (160–200 g/m²).</text><text x="0" y="14" class="sub">2. Knip elk kaartje langs de stippellijn uit: voor- en achterkant zitten aan elkaar.</text><text x="0" y="20" class="sub">3. Vouw langs de streep-puntlijn en plak de helften op elkaar (met een stukje karton ertussen wordt hij extra stevig).</text><text x="0" y="26" class="sub">4. Stop een kaartje in de spelkaartsleuf van de console, of bewaar ze in het spelhoesje.</text><text x="0" y="32" class="sub">Tip: plak achter één kaartje een cadeaubon of briefje – “Dit spel ontgrendelt een verrassing!”</text></g><g transform="translate(0,270)"><line x1="0" y1="0" x2="50" y2="0" stroke="#000" stroke-width=".5"/><line x1="0" y1="-1.5" x2="0" y2="1.5" stroke="#000" stroke-width=".5"/><line x1="50" y1="-1.5" x2="50" y2="1.5" stroke="#000" stroke-width=".5"/><text x="54" y="1" class="lbl">controle: 5 cm</text></g></svg></section>
<section class="page"><svg class="vel" viewBox="0 0 190 277"><text x="0" y="8" class="kop">Wat speel je?</text><circle cx="4" cy="16.8" r="3.4" fill="#ff4f9a"/><text x="4" y="18.0" font-size="3.2" fill="#fff" text-anchor="middle">1</text><text x="11" y="18.0" font-size="4" fill="#222">Pakjesavond Party</text><text x="188" y="18.0" font-size="2.8" fill="#ff4f9a" text-anchor="end" font-family="Verdana, Arial">FEEST</text><text x="11" y="22.6" class="sub">Minispellen voor 1–4 spelers: wie bezorgt de meeste pakjes vóór de bel gaat?</text><circle cx="4" cy="29.400000000000002" r="3.4" fill="#3d8bff"/><text x="4" y="30.6" font-size="3.2" fill="#fff" text-anchor="middle">2</text><text x="11" y="30.6" font-size="4" fill="#222">Stoomboot Sprint</text><text x="188" y="30.6" font-size="2.8" fill="#3d8bff" text-anchor="end" font-family="Verdana, Arial">RACE</text><text x="11" y="35.2" class="sub">Stoom met volle vaart van Spanje naar Nederland en ontwijk de golven.</text><circle cx="4" cy="42.0" r="3.4" fill="#7b5cff"/><text x="4" y="43.2" font-size="3.2" fill="#fff" text-anchor="middle">3</text><text x="11" y="43.2" font-size="4" fill="#222">Dakrijders</text><text x="188" y="43.2" font-size="2.8" fill="#7b5cff" text-anchor="end" font-family="Verdana, Arial">AVONTUUR</text><text x="11" y="47.800000000000004" class="sub">Galoppeer met het schimmelpaard over de daken en mis geen enkele schoorsteen.</text><circle cx="4" cy="54.599999999999994" r="3.4" fill="#ff8a1c"/><text x="4" y="55.8" font-size="3.2" fill="#fff" text-anchor="middle">4</text><text x="11" y="55.8" font-size="4" fill="#222">Pepernoten Puzzel</text><text x="188" y="55.8" font-size="2.8" fill="#ff8a1c" text-anchor="end" font-family="Verdana, Arial">PUZZEL</text><text x="11" y="60.4" class="sub">Schuif de pepernoten op een rij en laat ze knallen voor bonuspunten.</text><circle cx="4" cy="67.2" r="3.4" fill="#e8333a"/><text x="4" y="68.4" font-size="3.2" fill="#fff" text-anchor="middle">5</text><text x="11" y="68.4" font-size="4" fill="#222">Schoentje Zetten</text><text x="188" y="68.4" font-size="2.8" fill="#e8333a" text-anchor="end" font-family="Verdana, Arial">SIMULATIE</text><text x="11" y="73.0" class="sub">Zet je schoen bij de haard, vul hem met een wortel en wacht op de verrassing.</text><circle cx="4" cy="79.8" r="3.4" fill="#9b59ff"/><text x="4" y="81.0" font-size="3.2" fill="#fff" text-anchor="middle">6</text><text x="11" y="81.0" font-size="4" fill="#222">Chocoladeletter Legends</text><text x="188" y="81.0" font-size="2.8" fill="#9b59ff" text-anchor="end" font-family="Verdana, Arial">ACTIE</text><text x="11" y="85.6" class="sub">Word een echte legende met je eigen chocoladeletter als zwaard en schild.</text><circle cx="4" cy="92.39999999999999" r="3.4" fill="#d6262e"/><text x="4" y="93.6" font-size="3.2" fill="#fff" text-anchor="middle">7</text><text x="11" y="93.6" font-size="4" fill="#222">Mijter Mania</text><text x="188" y="93.6" font-size="2.8" fill="#d6262e" text-anchor="end" font-family="Verdana, Arial">RITME</text><text x="11" y="98.19999999999999" class="sub">Dans en tik op de maat van de pakjesavondmuziek. Hoe hoger je score, hoe hoger de mijter!</text><circle cx="4" cy="105.0" r="3.4" fill="#c98a4a"/><text x="4" y="106.2" font-size="3.2" fill="#fff" text-anchor="middle">8</text><text x="11" y="106.2" font-size="4" fill="#222">Speculaas Bakkerij</text><text x="188" y="106.2" font-size="2.8" fill="#c98a4a" text-anchor="end" font-family="Verdana, Arial">KOOK</text><text x="11" y="110.8" class="sub">Kneed, vorm en bak de lekkerste speculaas van het hele land.</text><circle cx="4" cy="117.6" r="3.4" fill="#ff7fb2"/><text x="4" y="118.8" font-size="3.2" fill="#fff" text-anchor="middle">9</text><text x="11" y="118.8" font-size="4" fill="#222">Marsepein Match</text><text x="188" y="118.8" font-size="2.8" fill="#ff7fb2" text-anchor="end" font-family="Verdana, Arial">PUZZEL</text><text x="11" y="123.39999999999999" class="sub">Combineer drie dezelfde marsepeinfiguurtjes en verdien extra levels.</text><circle cx="4" cy="130.2" r="3.4" fill="#ff5148"/><text x="4" y="131.39999999999998" font-size="3.2" fill="#fff" text-anchor="middle">10</text><text x="11" y="131.39999999999998" font-size="4" fill="#222">Schoorsteen Glijbaan</text><text x="188" y="131.39999999999998" font-size="2.8" fill="#ff5148" text-anchor="end" font-family="Verdana, Arial">RACE</text><text x="11" y="135.99999999999997" class="sub">Glijd door de schoorsteen naar beneden en vang alle pakjes onderweg.</text><circle cx="4" cy="142.8" r="3.4" fill="#8c1b22"/><text x="4" y="144.0" font-size="3.2" fill="#fff" text-anchor="middle">11</text><text x="11" y="144.0" font-size="4" fill="#222">Het Grote Boek</text><text x="188" y="144.0" font-size="2.8" fill="#8c1b22" text-anchor="end" font-family="Verdana, Arial">AVONTUUR</text><text x="11" y="148.6" class="sub">Ontdek alle geheimen uit het grote boek van Sinterklaas. Wie was er lief dit jaar?</text><circle cx="4" cy="155.4" r="3.4" fill="#ffb000"/><text x="4" y="156.6" font-size="3.2" fill="#fff" text-anchor="middle">12</text><text x="11" y="156.6" font-size="4" fill="#222">Strooigoed Storm</text><text x="188" y="156.6" font-size="2.8" fill="#ffb000" text-anchor="end" font-family="Verdana, Arial">ACTIE</text><text x="11" y="161.2" class="sub">Het regent pepernoten! Vang zoveel mogelijk strooigoed in je zak.</text><circle cx="4" cy="168.0" r="3.4" fill="#2fbf71"/><text x="4" y="169.2" font-size="3.2" fill="#fff" text-anchor="middle">13</text><text x="11" y="169.2" font-size="4" fill="#222">Gedichten Studio</text><text x="188" y="169.2" font-size="2.8" fill="#2fbf71" text-anchor="end" font-family="Verdana, Arial">CREATIEF</text><text x="11" y="173.79999999999998" class="sub">Schrijf de grappigste sinterklaasgedichten met de rijmmachine.</text><circle cx="4" cy="180.6" r="3.4" fill="#3d8bff"/><text x="4" y="181.79999999999998" font-size="3.2" fill="#fff" text-anchor="middle">14</text><text x="11" y="181.79999999999998" font-size="4" fill="#222">Surprise Bouwers</text><text x="188" y="181.79999999999998" font-size="2.8" fill="#3d8bff" text-anchor="end" font-family="Verdana, Arial">BOUWEN</text><text x="11" y="186.39999999999998" class="sub">Knip, plak en verf de mooiste surprises – van raket tot spelcomputer.</text><circle cx="4" cy="193.20000000000002" r="3.4" fill="#ff8a1c"/><text x="4" y="194.4" font-size="3.2" fill="#fff" text-anchor="middle">15</text><text x="11" y="194.4" font-size="4" fill="#222">Wortel Race</text><text x="188" y="194.4" font-size="2.8" fill="#ff8a1c" text-anchor="end" font-family="Verdana, Arial">RACE</text><text x="11" y="199.0" class="sub">Race met het paard over het strand en hap onderweg alle wortels op.</text><circle cx="4" cy="205.8" r="3.4" fill="#2fbf71"/><text x="4" y="207.0" font-size="3.2" fill="#fff" text-anchor="middle">16</text><text x="11" y="207.0" font-size="4" fill="#222">Pieten Gym</text><text x="188" y="207.0" font-size="2.8" fill="#2fbf71" text-anchor="end" font-family="Verdana, Arial">SPORT</text><text x="11" y="211.6" class="sub">Klim in touwen, spring over daken en word de fitste helper van het pakhuis.</text><circle cx="4" cy="218.4" r="3.4" fill="#e8333a"/><text x="4" y="219.6" font-size="3.2" fill="#fff" text-anchor="middle">17</text><text x="11" y="219.6" font-size="4" fill="#222">Intocht Avontuur</text><text x="188" y="219.6" font-size="2.8" fill="#e8333a" text-anchor="end" font-family="Verdana, Arial">AVONTUUR</text><text x="11" y="224.2" class="sub">Zwaai Sinterklaas uit bij de haven en volg de stoet door de hele stad.</text><circle cx="4" cy="231.0" r="3.4" fill="#f2c230"/><text x="4" y="232.2" font-size="3.2" fill="#fff" text-anchor="middle">18</text><text x="11" y="232.2" font-size="4" fill="#222">Staf van Sint</text><text x="188" y="232.2" font-size="2.8" fill="#f2c230" text-anchor="end" font-family="Verdana, Arial">AVONTUUR</text><text x="11" y="236.79999999999998" class="sub">De gouden staf is kwijt! Doorzoek bergen, bossen en kastelen om hem terug te vinden.</text><circle cx="4" cy="243.6" r="3.4" fill="#6b3d1e"/><text x="4" y="244.79999999999998" font-size="3.2" fill="#fff" text-anchor="middle">19</text><text x="11" y="244.79999999999998" font-size="4" fill="#222">Kruidnoten Kanon</text><text x="188" y="244.79999999999998" font-size="2.8" fill="#6b3d1e" text-anchor="end" font-family="Verdana, Arial">ACTIE</text><text x="11" y="249.39999999999998" class="sub">Mik de kruidnoten precies in de schoentjes. Hoeveel punten scoor jij?</text><circle cx="4" cy="256.2" r="3.4" fill="#7b5cff"/><text x="4" y="257.4" font-size="3.2" fill="#fff" text-anchor="middle">20</text><text x="11" y="257.4" font-size="4" fill="#222">Sint in de Ruimte</text><text x="188" y="257.4" font-size="2.8" fill="#7b5cff" text-anchor="end" font-family="Verdana, Arial">SCIENCEFICTION</text><text x="11" y="262.0" class="sub">Een raket in de vorm van een mijter! Bezorg pakjes op elke planeet.</text></svg></section>
