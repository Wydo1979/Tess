  @page { size: A3 landscape; margin: 0; }

<script>
  const naam = document.getElementById('in-naam');
  const zet = () => document.querySelectorAll('.naam').forEach(el => el.textContent = naam.value.trim() || 'jou');
  naam.addEventListener('input', zet); zet();
  document.getElementById('in-plaatje').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = document.getElementById('achtergrond');
      img.setAttribute('href', r.result); img.style.display = '';
      document.getElementById('standaardscene').style.display = 'none';
    };
    r.readAsDataURL(f);
  });
</script>
